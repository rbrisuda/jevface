[versions]
spring-boot = "4.1.1"
typesafe = "0.2.0"
jspecify = "1.0.0"
errorprone-core = "2.50.0"
errorprone-plugin = "5.1.1"
nullaway = "0.14.2"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
typesafe-bom = { module = "org.springaicommunity:typesafe-bom", version.ref = "typesafe" }
typesafe-java-sdk = { module = "org.springaicommunity:typesafe-java-sdk", version.ref = "typesafe" }
spring-ai-starter-typesafe = { module = "org.springaicommunity:spring-ai-starter-typesafe", version.ref = "typesafe" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-core" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
